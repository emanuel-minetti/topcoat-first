[package]
name = "topcoat_first"
version = "0.1.0"
edition = "2024"
default-run = "topcoat_first"

[dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
topcoat = { version = "0.12.1", features = [
    "icon-iconify",
    "asset",
    "ui",
    "tailwind",
    "font-fontsource",
    "l10n-fluent",
    "cookie",
    "runtime",
    "session"]
}
toasty = { version = "0.11.0", default-features = false, features = ["postgresql", "jiff"] }
toasty-cli = "0.11.0"
anyhow = "1.0.104"
uuid = "1.29.2"
jiff = "0.2.43"
topcoat-core = "0.12.1"

[build-dependencies]
topcoat = { version = "0.12.1", default-features = false, features = [
    "icon-iconify",
    "tailwind"]
}
