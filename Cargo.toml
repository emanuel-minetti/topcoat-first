[package]
name = "topcoat-first"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
topcoat = { version = "0.11.0", features = [
    "icon-iconify",
    "asset",
    "ui",
    "tailwind",
    "font-fontsource",
    "l10n-fluent"]
}

[build-dependencies]
topcoat = { version = "0.11.0", default-features = false, features = [
    "icon-iconify",
    "tailwind"]
}
